<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>

  <style>
    * { box-sizing: border-box; }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #eaf0f8;
      font-family: Arial, sans-serif;
    }

    .calculator {
      width: min(340px, 92vw);
      padding: 20px;
      background: #172554;
      border-radius: 18px;
      box-shadow: 0 16px 40px #17255440;
    }

    #display {
      width: 100%;
      height: 70px;
      margin-bottom: 14px;
      padding: 12px;
      color: #172554;
      background: #f8fafc;
      border: 0;
      border-radius: 10px;
      font-size: 2rem;
      text-align: right;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      min-height: 58px;
      border: 0;
      border-radius: 10px;
      background: #dbeafe;
      color: #172554;
      font-size: 1.2rem;
      cursor: pointer;
    }

    button:hover { background: #bfdbfe; }

    .operator { background: #a5b4fc; }
    .clear { background: #fda4af; }
    .equals {
      grid-column: span 2;
      background: #34d399;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main class="calculator" aria-label="Calculator">
    <input id="display" type="text" value="0" readonly aria-label="Display">

    <div class="buttons">
      <button class="clear" data-action="clear">AC</button>
      <button data-action="delete">⌫</button>
      <button class="operator" data-value="/">÷</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="+">+</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button data-action="sign">±</button>

      <button data-value="0">0</button>
      <button data-action="decimal">.</button>
      <button class="equals" data-action="equals">=</button>
    </div>
  </main>

  <script>
    const display = document.getElementById("display");
    let current = "0";
    let previous = null;
    let operator = null;
    let startNewNumber = false;

    function updateDisplay() {
      display.value = current;
    }

    document.querySelector(".buttons").addEventListener("click", event => {
      const button = event.target.closest("button");
      if (!button) return;

      const value = button.dataset.value;
      const action = button.dataset.action;

      if (action === "clear") {
        current = "0";
        previous = null;
        operator = null;
        startNewNumber = false;
      } else if (action === "delete") {
        current = current.length > 1 ? current.slice(0, -1) : "0";
      } else if (action === "decimal") {
        if (startNewNumber) {
          current = "0";
          startNewNumber = false;
        }
        if (!current.includes(".")) current += ".";
      } else if (action === "sign") {
        if (current !== "0") current = String(Number(current) * -1);
      } else if (action === "equals") {
        calculate();
        operator = null;
        previous = null;
        startNewNumber = true;
      } else if (value) {
        if (["+", "-", "*", "/"].includes(value)) {
          if (operator && !startNewNumber) calculate();
          previous = current;
          operator = value;
          startNewNumber = true;
        } else {
          if (startNewNumber || current === "0") {
            current = value;
            startNewNumber = false;
          } else {
            current += value;
          }
        }
      }

      updateDisplay();
    });

    function calculate() {
      if (previous === null || !operator) return;

      const a = Number(previous);
      const b = Number(current);
      let result;

      if (operator === "+") result = a + b;
      if (operator === "-") result = a - b;
      if (operator === "*") result = a * b;
      if (operator === "/") result = b === 0 ? "Error" : a / b;

      current = typeof result === "number"
        ? String(Number(result.toPrecision(10)))
        : result;
    }
  </script>
</body>
</html>
