<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI SDLC Generator</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172554;
      --muted: #64748b;
      --brand: #4f46e5;
      --brand-dark: #3730a3;
      --accent: #0ea5a4;
      --line: #e2e8f0;
      --surface: #ffffff;
      --page: #f1f5ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 12% 8%, #dbeafe 0, transparent 32%),
                  radial-gradient(circle at 90% 88%, #ccfbf1 0, transparent 30%), var(--page);
    }
    .container {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: clamp(24px, 5vw, 48px);
      background: var(--surface);
      border: 1px solid rgba(148, 163, 184, .28);
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(30, 41, 99, .12);
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      margin: 0 auto 16px;
      color: white;
      background: linear-gradient(135deg, var(--brand), #818cf8);
      border-radius: 18px;
      box-shadow: 0 10px 24px rgba(79, 70, 229, .28);
    }
    .brand-mark svg { width: 30px; height: 30px; }
    h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.4rem); letter-spacing: -.04em; }
    .intro { margin: 10px auto 30px; color: var(--muted); line-height: 1.6; }
    label { display: block; margin-bottom: 10px; text-align: left; font-weight: 700; }
    .input-wrap { position: relative; }
    .input-wrap svg {
      position: absolute; top: 50%; left: 15px; width: 20px; height: 20px;
      color: #818cf8; transform: translateY(-50%); pointer-events: none;
    }
    input {
      width: 100%; min-height: 52px; padding: 12px 15px 12px 46px;
      color: var(--ink); background: #fbfcff; border: 1px solid #cbd5e1;
      border-radius: 12px; font: inherit; outline: none; transition: .2s ease;
    }
    input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(99, 102, 241, .14); }
    button {
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      min-height: 50px; margin-top: 16px; padding: 0 22px; color: white;
      background: linear-gradient(135deg, var(--brand), #6366f1); border: 0;
      border-radius: 12px; font: inherit; font-weight: 700; cursor: pointer;
      box-shadow: 0 8px 18px rgba(79, 70, 229, .22); transition: transform .2s, box-shadow .2s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(79, 70, 229, .28); }
    button:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 3px; }
    button svg { width: 19px; height: 19px; }
    #result { margin-top: 28px; text-align: left; }
    .empty { padding: 22px; color: var(--muted); background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 14px; text-align: center; }
    .empty svg { width: 26px; height: 26px; margin-bottom: 8px; color: #94a3b8; }
    .result-heading { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; font-size: 1.35rem; overflow-wrap: anywhere; }
    .result-heading svg { flex: 0 0 auto; width: 25px; height: 25px; color: var(--accent); }
    .steps { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
    .step {
      display: grid; grid-template-columns: 42px 1fr; align-items: start; gap: 13px;
      padding: 15px; background: #f8fafc; border: 1px solid var(--line); border-radius: 14px;
    }
    .step-icon { display: grid; place-items: center; width: 42px; height: 42px; color: var(--brand); background: #eef2ff; border-radius: 12px; }
    .step-icon svg { width: 21px; height: 21px; }
    .step h3 { margin: 1px 0 4px; font-size: 1rem; }
    .step p { margin: 0; color: #475569; line-height: 1.55; }
    .error { padding: 14px 16px; color: #9f1239; background: #fff1f2; border: 1px solid #fecdd3; border-radius: 12px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 520px) { body { padding: 24px 14px; } .container { border-radius: 18px; } button { width: 100%; } }
  </style>
</head>
<body>
  <svg class="sr-only" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="spark" viewBox="0 0 24 24"><path d="m12 3 1.9 5.8L20 11l-6.1 2.2L12 19l-2-5.8L4 11l6-2.2L12 3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m19 14 .9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9L19 14Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="file" viewBox="0 0 24 24"><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M13 3v7h7M8 15h8m-8 3h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="clipboard" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 5.5V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5M9 11h6m-6 4h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="layout" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 9h18M9 9v11" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="code" viewBox="0 0 24 24"><path d="m8 8-4 4 4 4m8-8 4 4-4 4m-2-11-4 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="rocket" viewBox="0 0 24 24"><path d="M4 16c-1 1-1 4-1 4s3 0 4-1l3-3-3-3-3 3Zm6 1 4 4c3-2 6-7 7-17-10 1-15 4-17 7l4 4m3-1 4-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="15" cy="8" r="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-1.6.9l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.6-.9l-1.7.6-1.4-2.4 1.4-1.1a7 7 0 0 1 0-1.9l-1.4-1.1 1.4-2.4 1.7.6a8 8 0 0 1 1.6-.9l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.6.9l1.7-.6 1.4 2.4-1.4 1.1a7 7 0 0 1-.1 1.8Z" transform="translate(-1 -1)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="empty" viewBox="0 0 24 24"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m4.5 7.8 7.5 4.4 7.5-4.4M12 12.2V21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  </svg>
  <main class="container">
    <div class="brand-mark"><svg aria-hidden="true"><use href="#spark"/></svg></div>
    <h1>AI SDLC Generator</h1>
    <p class="intro">Turn your project idea into a clear, practical software development roadmap.</p>
    <form id="generator-form">
      <label for="topic">What are you building?</label>
      <div class="input-wrap">
        <svg aria-hidden="true"><use href="#search"/></svg>
        <input type="text" id="topic" placeholder="e.g. Hospital Management System" autocomplete="off">
      </div>
      <button type="submit">Generate SDLC <svg aria-hidden="true"><use href="#arrow"/></svg></button>
    </form>
    <section id="result" aria-live="polite" aria-atomic="true">
      <div class="empty"><svg aria-hidden="true"><use href="#empty"/></svg><div>Your project roadmap will appear here.</div></div>
    </section>
  </main>
  <script>
    const stages = [
      { title: "Planning", icon: "file", detail: topic => `Set the goals, scope, budget, team, and timeline for your ${topic} project.` },
      { title: "Requirement Analysis", icon: "clipboard", detail: topic => `Gather and prioritize the user, business, and technical requirements for ${topic}.` },
      { title: "Design", icon: "layout", detail: () => "Plan the user experience, system architecture, data model, and security approach." },
      { title: "Development", icon: "code", detail: topic => `Build the ${topic} application in manageable, reviewable increments.` },
      { title: "Testing", icon: "check", detail: topic => `Verify that ${topic} works as expected, fix defects, and check performance and security.` },
      { title: "Deployment", icon: "rocket", detail: topic => `Release ${topic} to its users with monitoring and a clear rollout plan.` },
      { title: "Maintenance", icon: "settings", detail: topic => `Monitor ${topic}, resolve issues, and improve it as user needs change.` }
    ];

    document.getElementById("generator-form").addEventListener("submit", event => {
      event.preventDefault();
      const topic = document.getElementById("topic").value.trim();
      const result = document.getElementById("result");
      result.replaceChildren();

      if (!topic) {
        const message = document.createElement("p");
        message.className = "error";
        message.textContent = "Please enter a project topic to generate your roadmap.";
        result.append(message);
        document.getElementById("topic").focus();
        return;
      }

      const heading = document.createElement("h2");
      heading.className = "result-heading";
      heading.innerHTML = '<svg aria-hidden="true"><use href="#spark"/></svg>';
      const headingText = document.createElement("span");
      headingText.textContent = `SDLC roadmap for ${topic}`;
      heading.append(headingText);
      result.append(heading);

      const list = document.createElement("ol");
      list.className = "steps";
      stages.forEach((stage, index) => {
        const item = document.createElement("li");
        item.className = "step";
        const icon = document.createElement("span");
        icon.className = "step-icon";
        icon.setAttribute("aria-hidden", "true");
        icon.innerHTML = `<svg><use href="#${stage.icon}"/></svg>`;
        const content = document.createElement("div");
        const title = document.createElement("h3");
        title.textContent = `${index + 1}. ${stage.title}`;
        const detail = document.createElement("p");
        detail.textContent = stage.detail(topic);
        content.append(title, detail);
        item.append(icon, content);
        list.append(item);
      });
      result.append(list);
    });
  </script>
</body>
</html>
