<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Application Form</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 35px 15px;
      font-family: Arial, sans-serif;
      color: #1e293b;
      background: linear-gradient(135deg, #e0f2fe, #eef2ff);
    }

    .container {
      max-width: 760px;
      margin: auto;
      padding: 30px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 12px 35px #1e3a5f20;
    }

    h1 {
      margin: 0 0 8px;
      color: #1d4ed8;
      text-align: center;
    }

    .intro {
      margin: 0 0 25px;
      color: #64748b;
      text-align: center;
    }

    h2 {
      margin: 25px 0 15px;
      padding-bottom: 8px;
      color: #1e40af;
      border-bottom: 1px solid #dbeafe;
      font-size: 1.15rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .full { grid-column: 1 / -1; }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 0.92rem;
    }

    input, select, textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font: inherit;
    }

    textarea { min-height: 85px; resize: vertical; }

    input:focus, select:focus, textarea:focus {
      outline: 3px solid #bfdbfe;
      border-color: #2563eb;
    }

    .agreement {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 20px;
      color: #475569;
      line-height: 1.5;
    }

    .agreement input {
      width: auto;
      margin-top: 4px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      color: white;
      background: #2563eb;
      border: 0;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }

    #message {
      color: #15803d;
      text-align: center;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .container { padding: 22px 18px; }
      .grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>🎓 Student Application</h1>
    <p class="intro">Complete the form to apply for admission.</p>

    <form id="applicationForm">
      <h2>Personal Details</h2>
      <div class="grid">
        <div>
          <label for="firstName">First name *</label>
          <input id="firstName" name="firstName" autocomplete="given-name" required>
        </div>
        <div>
          <label for="lastName">Last name *</label>
          <input id="lastName" name="lastName" autocomplete="family-name" required>
        </div>
        <div>
          <label for="dob">Date of birth *</label>
          <input id="dob" name="dob" type="date" required>
        </div>
        <div>
          <label for="gender">Gender</label>
          <select id="gender" name="gender">
            <option value="">Select</option>
            <option>Female</option>
            <option>Male</option>
            <option>Non-binary</option>
            <option>Prefer not to say</option>
          </select>
        </div>
      </div>

      <h2>Contact Details</h2>
      <div class="grid">
        <div>
          <label for="email">Email address *</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div>
          <label for="phone">Phone number *</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" required>
        </div>
        <div class="full">
          <label for="address">Home address *</label>
          <textarea id="address" name="address" autocomplete="street-address" required></textarea>
        </div>
      </div>

      <h2>Academic Details</h2>
      <div class="grid">
        <div>
          <label for="program">Program of study *</label>
          <select id="program" name="program" required>
            <option value="">Choose a program</option>
            <option>Computer Science</option>
            <option>Business Administration</option>
            <option>Engineering</option>
            <option>Arts and Humanities</option>
            <option>Other</option>
          </select>
        </div>
        <div>
          <label for="startDate">Preferred start date</label>
          <input id="startDate" name="startDate" type="date">
        </div>
        <div class="full">
          <label for="education">Previous school or education *</label>
          <input id="education" name="education" required>
        </div>
        <div class="full">
          <label for="statement">Why are you applying?</label>
          <textarea id="statement" name="statement" placeholder="Tell us briefly about your goals"></textarea>
        </div>
      </div>

      <label class="agreement">
        <input type="checkbox" required>
        <span>I confirm that the information provided is accurate. *</span>
      </label>

      <button type="submit">Submit Application</button>
      <p id="message" aria-live="polite"></p>
    </form>
  </main>

  <script>
    document.getElementById("applicationForm").addEventListener("submit", function(event) {
      event.preventDefault();
      document.getElementById("message").textContent =
        "Your application has been submitted successfully!";
      this.reset();
    });
  </script>
</body>
</html>
